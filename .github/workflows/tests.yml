---
# yamllint disable rule:line-length
name: tests
'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  install-sh:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: bash tests/test_install.sh
